<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Premium Chat</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="glass-card">
            <div class="auth-header">
                <h1>Reset Password</h1>
                <p>Enter your email and we'll send you a reset link.</p>
            </div>
            
            <form id="forgot-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="hello@example.com" required>
                </div>
                
                <button type="submit" class="btn-primary" style="margin-top: 1rem;">Send Reset Link</button>
            </form>
            
            <div class="auth-footer">
                Remember your password? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
